# Render Blueprint: Web-Service (API + Oberfläche). Datenbank: Supabase (PostgreSQL), E-Mail: Resend (SMTP).
# In Render: New → Blueprint → dieses Repository wählen. Geheimnisse (sync: false) fragt Render beim ersten Anlegen ab.
services:
  - type: web
    name: aktien-tracker
    runtime: node
    region: frankfurt
    # free: schläft nach 15 Min. ohne Zugriffe ein (Aufwachen ca. 1 Min.). Ausgehend blockiert Render auf free
    # die SMTP-Ports 25/465/587 – deshalb nutzt Resend unten Port 2587.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Direkt mit node statt über npm: spart den zusätzlichen npm-Prozess. Heap-Grenze unter den 512 MB des free-Plans.
    startCommand: node --enable-source-maps --max-old-space-size=384 dist-server/index.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Supabase Session-Pooler (IPv4, Port 5432), nicht der Transaction-Pooler (6543):
      # postgresql://postgres.<projekt-ref>:<passwort>@aws-1-eu-central-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Leer lassen = Demo-Modus („Demo – keine echten Marktdaten“).
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Resend per SMTP. Passwort = Resend-API-Schlüssel; Absender muss zu einer bei Resend verifizierten Domain gehören.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      # z. B. Aktien-Tracker <noreply@deine-domain.de>
      - key: SMTP_FROM
        sync: false
